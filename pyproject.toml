[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "kivyfn-store"
version = "0.0.1"
description = "Reactive state management and local store system for kivyfn."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Gabtech", email = "gibrilhamideh@gmail.com" },
]

dependencies = [
    "kivy>=2.3.0",
    "kivyfn",
    "uuid6",
    "python-socketio>=5.11",
    "aiohttp>=3.9"
]


[dependency-groups]
dev = [
    "kivy-stubs",
]


[tool.uv.sources]
kivyfn = { path = "../kivyfn", editable = true }
kivy-stubs = { path = "../kivy-stubs", editable = true }


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
