[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "kivyfn-store"
version = "0.1.0"
description = "Reactive state management and local store system for kivyfn."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Gabtech", email = "gibrilhamideh@gmail.com" },
]

dependencies = [
    "kivy>=2.3.0",
    "kivyfn",
    "uuid6",
    "python-socketio>=5.11",
    "aiohttp>=3.9"
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "kivy-stubs",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]


[tool.uv.sources]
kivyfn = { path = "../kivyfn", editable = true }
kivy-stubs = { path = "../kivy-stubs", editable = true }


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
