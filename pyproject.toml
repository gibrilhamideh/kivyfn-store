[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "kivyfn-store"
version = "0.0.1"
description = "Reactive state management and local store system for kivyfn."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Gabtech", email = "gibrilhamideh@gmail.com" }
]

dependencies = [
    "kivy>=2.3.0",
    "kivyfn",
    "uuid6",
    "python-socketio[aiohttp]>=5.11,<6"
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.optional-dependencies]
dev = [
    "kivy-stubs>=0.1.0"
]
