[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kivyfn-store"
version = "0.1.0"
description = "Reactive state management and local store system for kivyfn."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabtech", email = "gibrilhamideh@gmail.com" }]
dependencies = [
    "kivy>=2.3.0",
    "uuid6",
    "python-socketio>=5.11",
    "aiohttp>=3.11",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 30

[tool.coverage.run]
branch = true
source = ["kivyfn.store"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"kivyfn.store" = ["py.typed"]
