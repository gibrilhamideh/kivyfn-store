[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kivyfn-store-devtools"
version = "0.1.0"
description = "Development tools for kivyfn-store."
requires-python = ">=3.11"
authors = [{ name = "Gabtech", email = "gibrilhamideh@gmail.com" }]
dependencies = [
    "kivyfn-store==0.1.0",
]

[tool.uv.sources]
kivyfn-store = { workspace = true }

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 30

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"kivyfn.store.devtools" = [
    "static/*",
    "static/assets/*",
]
